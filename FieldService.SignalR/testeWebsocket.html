<!DOCTYPE html>
<html>

<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
</head>
<body>
<h2>Testando SignalR Hub</h2>
<div id="status">Conectando...</div>

<script>
    const sessionId = "7ddcbac0-f7eb-434b-b36d-85790caa45ea";
    const hubUrl = `http://localhost:5221/hubs/signalr?sessionId=${sessionId}`;

    const connection = new signalR.HubConnectionBuilder()
        .withUrl(hubUrl, {
            skipNegotiation: true,
            transport: signalR.HttpTransportType.WebSockets
        })
        .configureLogging(signalR.LogLevel.Information)
        .build();

    connection.start()
        .then(() => {
            document.getElementById("status").innerText = "CONECTADO COM SUCESSO!";
            console.log("Conectado via WebSockets nativos!");
        })
        .catch(err => {
            document.getElementById("status").innerText = "ERRO: " + err;
            console.error(err);
        });
</script>
</body>
</html>
