services:
  postgres:
    image: postgres:16-alpine
    container_name: fieldservice-postgres
    restart: unless-stopped
    # 1. Força o início do PostgreSQL em UTC
    command: postgres -c timezone=UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-fieldservice}

      # 2. Força o sistema operacional do container a rodar em UTC
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fieldservice-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-fieldservice}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: fieldservice-mongodb
    restart: unless-stopped
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD:-admin123}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-fieldservice}
      TZ: UTC
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - fieldservice-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet --authenticationDatabase admin -u ${MONGODB_ROOT_USER:-admin} -p ${MONGODB_ROOT_PASSWORD:-admin123}
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: fieldservice-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - fieldservice-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  asb-sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: fieldservice-asb-sql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Strong_Passw0rd#2025"
      TZ: UTC
    networks:
      - fieldservice-network
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Strong_Passw0rd#2025' -Q 'SELECT 1' -C || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  servicebus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    container_name: fieldservice-servicebus
    restart: unless-stopped
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:5300:5300"
    environment:
      ACCEPT_EULA: "Y"
      SQL_SERVER: "asb-sql"
      MSSQL_SA_PASSWORD: "Strong_Passw0rd#2025"
      EMULATOR_HTTP_PORT: "5300"
      CONFIG_PATH: "/ServiceBus_Emulator/ConfigFiles/Config.json"
      TZ: UTC
    volumes:
      - ./docker/ServiceBusEmulator/Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    depends_on:
      asb-sql:
        condition: service_healthy
    networks:
      - fieldservice-network
       
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    container_name: fieldservice-aspire-dashboard
    restart: unless-stopped
    ports:
      - "${ASPIRE_DASHBOARD_PORT:-18888}:18888"
      - "${ASPIRE_OTLP_GRPC_PORT:-18889}:18889"
    environment:
      DASHBOARD__FRONTEND__AUTHMODE: Unsecured
      DASHBOARD__OTLP__AUTHMODE: Unsecured
      TZ: UTC
    networks:
      - fieldservice-network

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: fieldservice-azurite
    hostname: azurite
    restart: unless-stopped
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
    ports:
      - "${AZURITE_BLOB_PORT:-20000}:10000"
      - "${AZURITE_QUEUE_PORT:-20001}:10001"
      - "${AZURITE_TABLE_PORT:-20002}:10002"
    volumes:
      - azurite_data:/data
    networks:
      - fieldservice-network
      
  superset:
    image: apache/superset:3.1.3
    container_name: fieldservice-superset
    restart: unless-stopped
    user: root
    ports:
      - "8088:8088"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-fieldservice}
      SUPERSET_CONFIG_PATH: "/app/pythonpath/superset_config.py"
      SUPERSET_SECRET_KEY: "3OsmrhVnMn7kyXgRPhwV4vfVC0KwE6wmZh4R9mzmxkM="
      SUPERSET_METADATA_DATABASE_URL: "postgresql+psycopg2://postgres:postgres123@postgres:5432/fieldservice"
      SUPERSET_METADATA_SCHEMA: "superset"
      SUPERSET_APP_DB_NAME: "PostgreSQL"
      SUPERSET_TENANT_DB_NAME: "fieldservice"

      SUPERSET_ADMIN_USERNAME: "admin"
      SUPERSET_ADMIN_FIRST_NAME: "Admin"
      SUPERSET_ADMIN_LAST_NAME: "Core"
      SUPERSET_ADMIN_EMAIL: "admin@fieldservice.com"
      SUPERSET_ADMIN_PASSWORD: "admin123"

      AUTH_USER_REGISTRATION: "False"
      AUTH_TYPE: "AUTH_DB"
      SUPERSET_ENV: "production"
      TENANT_ID: "48b2053d-09a1-4785-8f5e-a28f1d8087e4"
      DATABASE_URL: "postgresql+psycopg2://postgres:postgres123@postgres:5432/fieldservice"
      SUPERSET_DATA_SCHEMA: "public"
      SUPERSET_MOCKED_DATA_SCHEMA: "mocked_data"
      SUPERSET_SCHEMA_ACCESS_MODE: "exclusive"
      SUPERSET_DATA_SCHEMA_ROLE_NAME: "Scope_Data"
      SUPERSET_MOCKED_SCHEMA_ROLE_NAME: "Scope_MockedData"

      ALLOWED_FRAME_ANCESTORS: "http://localhost:3000 http://localhost:5173"
      PGOPTIONS: "-c search_path=superset,public"
      TZ: UTC
    command:
      - sh
      - -c
      - |
        set -eu

        # 1. Cria a configuração do Superset usando o schema de metadata e o 'public' no search_path
        cat <<'EOF' >/app/pythonpath/superset_config.py
        import os
        from flask import Flask
        from flask_appbuilder.security.manager import AUTH_DB
        from sqlalchemy import event, text

        SECRET_KEY = os.environ["SUPERSET_SECRET_KEY"]
        SQLALCHEMY_DATABASE_URI = os.environ["SUPERSET_METADATA_DATABASE_URL"]
        METADATA_SCHEMA = os.environ.get("SUPERSET_METADATA_SCHEMA", "superset")

        SQLALCHEMY_ENGINE_OPTIONS = {
            "connect_args": {
                "options": f"-c search_path={METADATA_SCHEMA},public"
            }
        }

        AUTH_TYPE = AUTH_DB
        AUTH_USER_REGISTRATION = False

        ENABLE_CORS = True
        CORS_OPTIONS = {
            "supports_credentials": True,
            "allow_headers": ["*"],
            "resources": ["*"],
            "origins": ["*"]
        }

        raw_origins = os.environ.get("ALLOWED_FRAME_ANCESTORS", "").split()
        TALISMAN_CONFIG = {
            "content_security_policy": {
                "frame-ancestors": ["'self'"] + raw_origins
            },
            "force_https": False
        }

        X_FRAME_OPTIONS = "ALLOWALL"
        SESSION_COOKIE_SAMESITE = "None"
        SESSION_COOKIE_SECURE = True

        FEATURE_FLAGS = {
            "EMBEDDED_SUPERSET": True
        }

        # Enforce mandatory tenant dashboard scoping (Tenant_<id>_Scope) for every new dashboard.
        TENANT_SCOPE_ROLE_PREFIX = "Tenant_"
        TENANT_SCOPE_ROLE_SUFFIX = "_Scope"

        def _register_tenant_dashboard_scope_listeners(app: Flask) -> None:
            if app.extensions.get("tenant_dashboard_scope_listeners_registered"):
                return

            with app.app_context():
                from superset.models.dashboard import Dashboard

                def _resolve_single_tenant_scope_role_id(connection, user_id):
                    rows = connection.execute(
                        text(
                            "SELECT r.id "
                            "FROM ab_user_role ur "
                            "JOIN ab_role r ON r.id = ur.role_id "
                            "WHERE ur.user_id = :user_id "
                            "AND r.name LIKE :role_pattern"
                        ),
                        {
                            "user_id": user_id,
                            "role_pattern": f"{TENANT_SCOPE_ROLE_PREFIX}%{TENANT_SCOPE_ROLE_SUFFIX}",
                        },
                    ).fetchall()

                    if len(rows) != 1:
                        raise RuntimeError(
                            "Dashboard creation blocked: creator must have exactly one Tenant_*_Scope role."
                        )

                    return int(rows[0][0])

                @event.listens_for(Dashboard, "before_insert")
                def _enforce_tenant_scope_before_dashboard_insert(mapper, connection, target):
                    creator_id = getattr(target, "created_by_fk", None)
                    if creator_id is None:
                        raise RuntimeError(
                            "Dashboard creation blocked: created_by_fk is required for tenant scope resolution."
                        )

                    role_id = _resolve_single_tenant_scope_role_id(connection, creator_id)
                    setattr(target, "_tenant_scope_role_id", role_id)

                @event.listens_for(Dashboard, "after_insert")
                def _attach_tenant_scope_after_dashboard_insert(mapper, connection, target):
                    role_id = getattr(target, "_tenant_scope_role_id", None)
                    if role_id is None:
                        creator_id = getattr(target, "created_by_fk", None)
                        role_id = _resolve_single_tenant_scope_role_id(connection, creator_id)

                    connection.execute(
                        text(
                            "INSERT INTO dashboard_roles (dashboard_id, role_id) "
                            "SELECT :dashboard_id, :role_id "
                            "WHERE NOT EXISTS ("
                            "SELECT 1 FROM dashboard_roles "
                            "WHERE dashboard_id = :dashboard_id AND role_id = :role_id"
                            ")"
                        ),
                        {"dashboard_id": target.id, "role_id": role_id},
                    )

            app.extensions["tenant_dashboard_scope_listeners_registered"] = True

        def FLASK_APP_MUTATOR(app: Flask) -> None:
            _register_tenant_dashboard_scope_listeners(app)

        RECAPTCHA_PUBLIC_KEY = ""
        RECAPTCHA_PRIVATE_KEY = ""
        GUEST_ROLE_NAME = "Gamma"
        EOF

        superset db upgrade

        # 2. Garante a criação ou atualização do usuário Admin sem silenciar erros críticos
        superset fab create-admin \
          --username "$$SUPERSET_ADMIN_USERNAME" \
          --firstname "$$SUPERSET_ADMIN_FIRST_NAME" \
          --lastname "$$SUPERSET_ADMIN_LAST_NAME" \
          --email "$$SUPERSET_ADMIN_EMAIL" \
          --password "$$SUPERSET_ADMIN_PASSWORD" || true

        superset init

        # Script Python inline para expurgar permissões globais e criar os escopos de Schema
        python3 - <<'PYTHON_SCRIPT'
        import os
        from superset.app import create_app
        from superset.extensions import db, security_manager

        app = create_app()
        with app.app_context():
            from superset.models.core import Database

            db_name = os.environ.get("SUPERSET_TENANT_DB_NAME")
            if not db_name:
                raise RuntimeError("SUPERSET_TENANT_DB_NAME is required for tenant role bootstrap.")

            tenant_id_raw = os.environ.get("TENANT_ID")
            if not tenant_id_raw:
                raise RuntimeError("TENANT_ID is required for tenant role bootstrap.")

            tenant_id_n = tenant_id_raw.replace("-", "").lower()
            tenant_scope_role_name = f"Tenant_{tenant_id_n}_Scope"

            database_uri = os.environ.get("DATABASE_URL") or os.environ.get("SUPERSET_METADATA_DATABASE_URL")
            if not database_uri:
                raise RuntimeError("DATABASE_URL or SUPERSET_METADATA_DATABASE_URL is required for tenant role bootstrap.")

            schema_scopes = {
                os.environ.get("SUPERSET_DATA_SCHEMA_ROLE_NAME", "Scope_Data"): os.environ.get("SUPERSET_DATA_SCHEMA", "public"),
                os.environ.get("SUPERSET_MOCKED_SCHEMA_ROLE_NAME", "Scope_MockedData"): os.environ.get("SUPERSET_MOCKED_DATA_SCHEMA", "mocked_data")
            }

            database = db.session.query(Database).filter_by(database_name=db_name).one_or_none()
            if database is None:
                database = Database(database_name=db_name, expose_in_sqllab=True)
                db.session.add(database)

            database.database_name = db_name
            database.expose_in_sqllab = True
            database.set_sqlalchemy_uri(database_uri)
            db.session.commit()

            security_manager.create_missing_perms()

            database_perm = security_manager.get_database_perm(database.id, database.database_name)
            if database_perm:
                security_manager.add_permission_view_menu("database_access", database_perm)

            db_pvm = security_manager.find_permission_view_menu("database_access", database_perm) if database_perm else None

            # 0. Cria a role de escopo do tenant da aplicacao (Tenant_<tenantIdN>_Scope).
            tenant_scope_role = security_manager.find_role(tenant_scope_role_name)
            if not tenant_scope_role:
                tenant_scope_role = security_manager.add_role(tenant_scope_role_name)

            if db_pvm and db_pvm not in tenant_scope_role.permissions:
                tenant_scope_role.permissions.append(db_pvm)

            schema_permission_names = {}
            for schema_name in schema_scopes.values():
                schema_perm = security_manager.get_schema_perm(database, schema_name)
                schema_permission_names[schema_name] = schema_perm
                if schema_perm:
                    security_manager.add_permission_view_menu("schema_access", schema_perm)

            db.session.commit()

            # 1. Permissões Globais a REVOGAR dos perfis padrão (Alpha, sql_lab, Gamma)
            restricted_pvms = [
                ("can_read", "Database"),
                ("can_write", "Database"),
                ("can_add", "Database"),
                ("can_delete", "Database"),
                ("can_export", "Database"),
                ("can_external_metadata_by_name", "Database"),
                ("can_select_star", "Database"),
                ("can_external_metadata", "Datasource"),
                ("can_external_metadata_by_name", "Datasource"),
                ("can_get_or_create_dataset", "Dataset"),
                ("can_save", "Datasource"),
                ("can_write", "Dataset"),
                ("can_add", "Dataset"),
                ("can_delete", "Dataset"),
                ("can_refresh", "Dataset"),
            ]

            roles_to_clean = ["Alpha", "sql_lab", "Gamma"]

            for r_name in roles_to_clean:
                role = security_manager.find_role(r_name)
                if not role:
                    continue

                for action, view in restricted_pvms:
                    pvm = security_manager.find_permission_view_menu(action, view)
                    if pvm and pvm in role.permissions:
                        role.permissions.remove(pvm)

                if db_pvm and db_pvm in role.permissions:
                    role.permissions.remove(db_pvm)

                # Remove global wildcard permissions (legacy names may vary with spaces/underscores).
                global_access_pvms = [
                    ("all_database_access", "all_database_access"),
                    ("all database access", "all_database_access"),
                    ("all_datasource_access", "all_datasource_access"),
                    ("all datasource access", "all_datasource_access"),
                ]
                for action, view in global_access_pvms:
                    wildcard_pvm = security_manager.find_permission_view_menu(action, view)
                    if wildcard_pvm and wildcard_pvm in role.permissions:
                        role.permissions.remove(wildcard_pvm)

                # Remove all-query permission from end-user roles to prevent unrestricted SQL history access.
                if r_name in {"Alpha", "Gamma"}:
                    all_query_pvm = security_manager.find_permission_view_menu("can_access", "all_query_access")
                    if all_query_pvm and all_query_pvm in role.permissions:
                        role.permissions.remove(all_query_pvm)

            # 2. Criação das Roles de Escopo de Schema para dados reais e dados mocked.
            for role_name, schema_name in schema_scopes.items():
                scope_role = security_manager.find_role(role_name)
                if not scope_role:
                    scope_role = security_manager.add_role(role_name)

                schema_perm = schema_permission_names.get(schema_name)
                schema_pvm = security_manager.find_permission_view_menu("schema_access", schema_perm) if schema_perm else None
                if schema_pvm and schema_pvm not in scope_role.permissions:
                    scope_role.permissions.append(schema_pvm)

            db.session.commit()
            print(">>> Bootstrapping de permissões do Tenant finalizado com sucesso!")
        PYTHON_SCRIPT

        exec gunicorn \
          --bind "0.0.0.0:8088" \
          --workers "1" \
          --timeout "120" \
          "superset.app:create_app()"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fieldservice-network

  keyvault:
    image: soluto/azure-keyvault-emulator:latest
    container_name: fieldservice-keyvault
    restart: unless-stopped
    ports:
      - "8443:5000"
    environment:
      TZ: UTC
    networks:
      - fieldservice-network

volumes:
  postgres_data:
    driver: local
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  azurite_data:
    driver: local

networks:
  fieldservice-network:
    driver: bridge